<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Stand -->
  <g fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="20" r="5" fill="#2dd4bf" />
    <!-- Torso -->
    <path d="M50 25 L50 45">
      <animate attributeName="d" 
               values="M50 25 L50 45; M50 35 L40 50; M50 25 L50 45" 
               dur="4s" repeatCount="indefinite" />
    </path>
    <!-- Arms -->
    <path d="M50 30 L40 40 L50 50">
      <animate attributeName="d" 
               values="M50 30 L40 40 L50 50; M45 40 L35 55 L35 65; M50 30 L40 40 L50 50" 
               dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M50 30 L60 40 L50 50">
      <animate attributeName="d" 
               values="M50 30 L60 40 L50 50; M45 40 L55 55 L55 65; M50 30 L60 40 L50 50" 
               dur="4s" repeatCount="indefinite" />
    </path>
    <!-- Legs -->
    <path d="M50 45 L40 65 L45 80">
      <animate attributeName="d" 
               values="M50 45 L40 65 L45 80; M40 50 L35 70 L40 85; M50 45 L40 65 L45 80" 
               dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M50 45 L60 65 L55 80">
      <animate attributeName="d" 
               values="M50 45 L60 65 L55 80; M40 50 L55 70 L50 85; M50 45 L60 65 L55 80" 
               dur="4s" repeatCount="indefinite" />
    </path>
    <!-- Head animation for bend -->
    <circle cx="50" cy="20" r="5" fill="#2dd4bf">
      <animate attributeName="cy" values="20; 30; 20" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cx" values="50; 55; 50" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
